<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hodiny — posunutá realita</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 30% 20%, #1b2b45, #070b14 70%);
      color: #dfe9f5;
      overflow: hidden;
    }
    h1 {
      font-weight: 300;
      margin: 0;
      font-size: clamp(1rem, 3.5vmin, 1.5rem);
      letter-spacing: .25em;
      text-transform: uppercase;
      opacity: .85;
    }
    nav { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; max-width: 92vw; }
    nav button {
      background: #14213699;
      color: #9fc2ee;
      border: 1px solid #3b567f;
      border-radius: 999px;
      padding: .35rem .8rem;
      font: inherit;
      font-size: .8rem;
      cursor: pointer;
      transition: all .2s;
    }
    nav button:hover { background: #24406b; color: #fff; }
    nav button.active {
      background: #7c4dff;
      color: #fff;
      border-color: #b794ff;
      box-shadow: 0 0 14px #7c4dff88;
    }
    canvas {
      width: min(70vmin, 440px);
      aspect-ratio: 1;
      filter: drop-shadow(0 10px 40px #000a);
      transition: filter .25s;
    }
    .digital {
      font-variant-numeric: tabular-nums;
      font-size: clamp(1rem, 3.4vmin, 1.5rem);
      letter-spacing: .08em;
      color: #8ff0d8;
      text-shadow: 0 0 12px #37ffc844;
      min-height: 1.5em;
    }
    body.m-zrcadlo .digital { transform: scaleX(-1); }
    .joke { opacity: .55; font-size: .8rem; font-style: italic; min-height: 1.2em; }
    body.shake canvas { animation: shake .09s infinite; }
    body.m-silenost { animation: rotacePlochy 6s linear infinite; }
    body.m-silenost h1 { animation: nervozniNadpis .13s infinite; }
    @keyframes rotacePlochy {
      0%, 100% { filter: none; }
      25% { filter: hue-rotate(90deg) saturate(3); }
      50% { filter: hue-rotate(200deg) invert(.15); }
      75% { filter: hue-rotate(310deg) saturate(2); }
    }
    @keyframes nervozniNadpis {
      50% { transform: skewX(9deg) scale(1.04); letter-spacing: .6em; }
    }
    @keyframes shake {
      25% { transform: translate(4px, -3px) rotate(.4deg); }
      75% { transform: translate(-4px, 3px) rotate(-.4deg); }
    }
  </style>
</head>
<body>
  <h1 id="nadpis">Hodiny</h1>
  <nav id="nav"></nav>
  <canvas id="c" aria-label="Analogové hodiny"></canvas>
  <div class="digital" id="digital"></div>
  <div class="joke" id="joke"></div>

  <script>
  "use strict";
  // ---------- cas serveru ----------
  const serverStart = new Date(
    {{ now.year }}, {{ now.month - 1 }}, {{ now.day }},
    {{ now.hour }}, {{ now.minute }}, {{ now.second }});
  let offset = serverStart.getTime() - Date.now();
  let extraMs = 0;                       // casova anomala (glitch rychlost)
  function sync() {
    fetch("/time").then(r => r.json())
      .then(d => { offset = new Date(d.iso).getTime() - Date.now(); })
      .catch(() => {});
  }
  setInterval(sync, 60000);
  const nowMs  = () => Date.now() + offset + extraMs;
  const nowD   = () => new Date(nowMs());

  // ---------- platno ----------
  const cvs = document.getElementById("c"), ctx = cvs.getContext("2d");
  let DPR = 1, S = 440;
  function resize() {
    DPR = window.devicePixelRatio || 1;
    S = cvs.clientWidth;
    cvs.width = cvs.height = Math.round(S * DPR);
  }
  addEventListener("resize", resize); resize();
  const TAU = Math.PI * 2;

  // ---------- rezimy ----------
  // uhelrucicek: hodiny/min/sec -> uzel ve smyslu hodin od 12
  const A = (d) => ({
    h: ((d.getHours() % 12) + d.getMinutes() / 60 + d.getSeconds() / 3600) * TAU / 12,
    m: (d.getMinutes() + d.getSeconds() / 60) * TAU / 60,
    s: (d.getSeconds() + d.getMilliseconds() / 1000) * TAU / 60,
  });

  const MODES = {
    chaos:    { jmeno: "Náhodná realita", typ: "spec" },
    klasicke: { jmeno: "Klasika",        typ: "cifernik", fn: a => a },
    zrcadlo:  { jmeno: "Zrcadlo",        typ: "cifernik", fn: a => -a, cls: "m-zrcadlo" },
    vzhuru:   { jmeno: "Vzhůru nohama",  typ: "cifernik", fn: a => a + Math.PI },
    pruzina:  { jmeno: "Pružina",        typ: "pruzina" },
    dravec:   { jmeno: "Dravec",         typ: "dravec" },
    soustava: { jmeno: "Soustava",       typ: "soustava" },
    binarka:  { jmeno: "Binárka",        typ: "binarka" },
    silenost: { jmeno: "☠ ABSOLUTNÍ ŠÍLENOST", typ: "silenost", cls: "m-silenost" },
  };
  let silny = 0;                       // eskalace ŠÍLENOSTI (0..1)
  const konfetti = [], vzkazy = [];    // částečky a vzkazy v ŠÍLENOSTI
  let dalsiTrysk = 0, dalsiVzkaz = 0, ztišeniAt = 0;
  let mode = "chaos", rezim = "chaos", chaosAt = 0;   // mode=zvoleny, rezim=kresleny
  const nav = document.getElementById("nav");
  for (const [k, m] of Object.entries(MODES)) {
    const b = document.createElement("button");
    b.textContent = m.jmeno; b.dataset.m = k;
    b.onclick = () => setMode(k);
    nav.appendChild(b);
  }
  function ladiTlacitka() {
    nav.querySelectorAll("button").forEach(b =>
      b.classList.toggle("active", b.dataset.m === mode));
  }
  function setMode(k) {
    mode = rezim = k;
    if (k !== "silenost") silny = 0;
    document.body.className = MODES[k].cls || "";
    document.getElementById("nadpis").textContent = "Hodiny — " + MODES[k].jmeno;
    ladiTlacitka();
    history.replaceState(null, "", "?m=" + k);
    if (k === "chaos") chaosAt = 0;
  }
  { const q = new URLSearchParams(location.search).get("m");
    setMode(MODES[q] ? q : "chaos"); }

  // ---------- pruzinove ruicky ----------
  // {poz, rych}; uhl neomezeny, dotaci nejnizsiho rozdilu
  const spring = { h: {p: 0, v: 0}, m: {p: 0, v: 0}, s: {p: 0, v: 0} };
  function stepSpring(s, target, k, d, dt) {
    let diff = (target - s.p) % TAU;
    if (diff >  Math.PI) diff -= TAU;
    if (diff < -Math.PI) diff += TAU;
    s.v += (k * diff - d * s.v) * dt;
    s.p += s.v * dt;
    return s.p;
  }

  // ---------- stopy pro soustavu ----------
  const stopy = { h: [], m: [], s: [] };

  // ----------.glitch ----------
  let glitch = { druh: null, do: 0 };
  let dalsiGlitch = performance.now() + 6000;
  const DRUHY = ["shake", "invert", "hue", "cisla", "rychlost", "ozvena"];
  function spustGlitch(silou = 1) {
    glitch = {
      druh: DRUHY[(Math.random() * DRUHY.length) | 0],
      do: performance.now() + 800 + Math.random() * 1800,
    };
    if (glitch.druh === "rychlost") glitch.rychlost = 12 + 40 * silou;
  }
  function updateGlitch(t, dt) {
    if (t > glitch.do) { glitch.druh = null; document.body.classList.remove("shake"); }
    if (t > dalsiGlitch) { spustGlitch(); dalsiGlitch = t + 7000 + Math.random() * 15000; }
    // chaos: stridani realit
    if (mode === "chaos" && t > chaosAt) {
      const klice = Object.keys(MODES).filter(k => k !== "chaos");
      setModePouze(klice[(Math.random() * klice.length) | 0]);
      chaosAt = t + 5000 + Math.random() * 8000;
      spustGlitch(0.6);
    }
    // casova anomalia: ruicky urychli a pak pružně dosedne na realitu
    if (glitch.druh === "rychlost") extraMs += (glitch.rychlost - 1) * dt * 1000;
    extraMs += (0 - extraMs) * Math.min(1, dt * 1.4); // navrat pruziny
  }
  function setModePouze(k) {          // chaos prepina jen "kreslenou realitu"
    rezim = k;
    document.body.className = MODES[k].cls || "";
    document.getElementById("nadpis").textContent = "Hodiny — " + MODES[k].jmeno;
    ladiTlacitka();
  }

  // ---------- kresleni ciferniku ----------
  function body(cx, cy, r) {
    const g = ctx.createRadialGradient(cx - r * .3, cy - r * .4, r * .1, cx, cy, r);
    g.addColorStop(0, "#fdfbf4"); g.addColorStop(1, "#cfd6e4");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
    ctx.lineWidth = r * .045; ctx.strokeStyle = "#22304a"; ctx.stroke();
  }
  function cisla(cx, cy, r, posFn, t) {
    ctx.font = `600 ${r * .13}px system-ui`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (let n = 1; n <= 12; n++) {
      let a = posFn(n * TAU / 12);
      let drh = r * .84;
      if (glitch.druh === "cisla") {           // cisla prchaji do vsech smeru
        a += Math.sin(t * .004 * n + n) * 1.4;
        drh *= .55 + .6 * Math.abs(Math.sin(t * .003 + n));
      }
      a -= Math.PI / 2;
      ctx.fillStyle = "#22304a";
      ctx.fillText(n, cx + Math.cos(a) * drh, cy + Math.sin(a) * drh);
    }
  }
  function rucicka(cx, cy, r, a, delka, sirka, barva) {
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(a);
    ctx.fillStyle = barva;
    ctx.beginPath();
    ctx.moveTo(-sirka, 0); ctx.lineTo(sirka, 0);
    ctx.lineTo(sirka * .35, -r * delka); ctx.lineTo(-sirka * .35, -r * delka);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // ---------- vykresleni jednotlivych realit ----------
  function drawCifernik(t) {
    const m = MODES[rezim], d = nowD(), uh = A(d);
    body(S / 2, S / 2, S * .46);
    cisla(S / 2, S / 2, S * .46, m.fn, t);
    rucicka(S / 2, S / 2, S * .46, m.fn(uh.h), .55, S * .02, "#22304a");
    rucicka(S / 2, S / 2, S * .46, m.fn(uh.m), .78, S * .013, "#374a6b");
    rucicka(S / 2, S / 2, S * .46, m.fn(uh.s), .84, S * .006, "#e74c3c");
    if (glitch.druh === "ozvena")              // ozveny z jinych realit
      for (let i = 0; i < 3; i++)
        rucicka(S / 2, S / 2, S * .46, m.fn(uh.m) + (i - 1) * .5, .78, S * .008, "#7c4dff33");
    ctx.fillStyle = "#e74c3c";
    ctx.beginPath(); ctx.arc(S / 2, S / 2, S * .018, 0, TAU); ctx.fill();
  }
  function drawPruzhina(t) {
    const d = nowD(), uh = A(d), dt = 1 / 60;
    body(S / 2, S / 2, S * .46);
    cisla(S / 2, S / 2, S * .46, a => a, t);
    const a = {
      h: stepSpring(spring.h, uh.h, 22, 5.5, dt),
      m: stepSpring(spring.m, uh.m, 45, 6, dt),
      s: stepSpring(spring.s, uh.s, 90, 7, dt),
    };
    rucicka(S / 2, S / 2, S * .46, a.h, .55, S * .02, "#22304a");
    rucicka(S / 2, S / 2, S * .46, a.m, .78, S * .013, "#374a6b");
    rucicka(S / 2, S / 2, S * .46, a.s, .84, S * .006, "#e74c3c");
    ctx.fillStyle = "#e74c3c";
    ctx.beginPath(); ctx.arc(S / 2, S / 2, S * .018, 0, TAU); ctx.fill();
  }
  function drawDravec(t) {
    const d = nowD(), uh = A(d), dt = 1 / 60;
    body(S / 2, S / 2, S * .46);
    cisla(S / 2, S / 2, S * .46, a => a, t);
    rucicka(S / 2, S / 2, S * .46, uh.h, .55, S * .02, "#22304a");
    rucicka(S / 2, S / 2, S * .46, uh.m, .78, S * .013, "#374a6b");
    // stopa: obze se kolem minutky, obcas se vrhne k 12 (na sekundy)
    const aS = stepSpring(spring.s, uh.s + Math.sin(t * .004) * (uh.s - uh.m) * .12, 300, 20, dt);
    rucicka(S / 2, S / 2, S * .46, aS, .84, S * .007, "#e74c3c");
    const chnap = Math.abs((uh.s - uh.m + Math.PI * 3) % TAU - Math.PI) < .05;
    ctx.save();                                    // hlava stopare
    ctx.translate(S / 2, S / 2); ctx.rotate(aS);
    ctx.fillStyle = "#e74c3c";
    ctx.beginPath(); ctx.arc(0, -S * .38, S * .03, 0, TAU); ctx.fill();
    if (chnap) { ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(0, -S * .38, S * .015, 0, Math.PI); ctx.fill(); }
    ctx.restore();
    ctx.fillStyle = "#e74c3c";
    ctx.beginPath(); ctx.arc(S / 2, S / 2, S * .018, 0, TAU); ctx.fill();
  }
  function drawSoustava(t) {
    const d = nowD(), uh = A(d), c = S / 2;
    ctx.fillStyle = "#070b14";
    ctx.beginPath(); ctx.arc(c, c, S * .48, 0, TAU); ctx.fill();
    const planety = [
      { k: "h", a: uh.h, r: .16, vel: .035, barva: "#ffd75e", jmeno: "Slunce" },
      { k: "m", a: uh.m, r: .29, vel: .024, barva: "#5ec8ff", jmeno: "Země" },
      { k: "s", a: uh.s, r: .42, vel: .013, barva: "#cfd8e8", jmeno: "Měsíc" },
    ];
    for (const p of planety) {
      ctx.strokeStyle = "#ffffff14";
      ctx.beginPath(); ctx.arc(c, c, S * p.r, 0, TAU); ctx.stroke();
      const stopa = stopy[p.k];
      stopa.push({ x: c + Math.sin(p.a) * S * p.r, y: c - Math.cos(p.a) * S * p.r });
      if (stopa.length > 70) stopa.shift();
      stopa.forEach((b, i) => {
        ctx.fillStyle = p.barva + Math.round(i / stopa.length * 80).toString(16).padStart(2, "0");
        ctx.beginPath(); ctx.arc(b.x, b.y, S * .004, 0, TAU); ctx.fill();
      });
      ctx.fillStyle = p.barva;
      ctx.shadowColor = p.barva; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(c + Math.sin(p.a) * S * p.r, c - Math.cos(p.a) * S * p.r, S * p.vel, 0, TAU);
      ctx.fill(); ctx.shadowBlur = 0;
    }
  }
  function drawBinarka(t) {
    const d = nowD(), c = S / 2;
    ctx.fillStyle = "#0a1120";
    ctx.beginPath(); ctx.arc(c, c, S * .48, 0, TAU); ctx.fill();
    const sloupce = [
      { hod: d.getHours(),     r: .16, barva: "#ffd75e" },
      { hod: d.getMinutes(),   r: .30, barva: "#5ec8ff" },
      { hod: d.getSeconds(),   r: .44, barva: "#8ff0d8" },
    ];
    for (const s of sloupce)
      for (let b = 0; b < 6; b++) {
        const a = b * TAU / 6 - Math.PI / 2 + (t * .00012);  // pomaly se točí
        const x = c + Math.cos(a) * S * s.r, y = c + Math.sin(a) * S * s.r;
        const sviti = (s.hod >> (5 - b)) & 1;
        ctx.beginPath(); ctx.arc(x, y, S * .026, 0, TAU);
        if (sviti) { ctx.fillStyle = s.barva; ctx.shadowColor = s.barva; ctx.shadowBlur = 16; }
        else { ctx.fillStyle = "#ffffff10"; ctx.shadowBlur = 0; }
        ctx.fill(); ctx.shadowBlur = 0;
      }
  }

  // ---------- ☠ ABSOLUTNÍ ŠÍLENOST ----------
  // hodiny, v jejichž ručičkách rostou další hodiny, v jejichž ručičkách…
  function silClock(cx, cy, r, depth, t, rot) {
    const barva = `hsl(${(t * .25 + depth * 60 + r) % 360} 85% 62%)`;
    ctx.strokeStyle = barva;
    ctx.lineWidth = Math.max(.6, r * .03);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
    if (r < 3) return;
    const d = nowD(), uh = A(d);
    const uhly = [uh.h + rot, uh.m - rot * 1.7, uh.s + rot * .6];
    const delky = [.5, .68, .84];
    for (let i = 0; i < 3; i++) {
      const a = uhly[i] + (depth % 2 ? Math.PI : 0);   // patra se točí střídavě
      const x = cx + Math.sin(a) * r * delky[i], y = cy - Math.cos(a) * r * delky[i];
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y);
      ctx.globalAlpha = .6; ctx.stroke(); ctx.globalAlpha = 1;
      silClock(x, y, r * (.36 + silny * .09), depth - 1, t, rot * -1.3);
    }
  }
  const VZKAZY = ["POZOR", "ČAS UNIKÁ!!", "TO NEJDE ZASTAVIT", "8=============D",
    "tik? tik?! TIK!!", "kdo tohle čte, už je pozdě", "hhmmmm…", "😱", "TK TK TK"];
  function drawSilenost(t) {
    silny = Math.min(1, silny + .00045);            // každou vteři o něco blíž konci
    const c = S / 2;
    // ~1,2 s ticha každých ~9 s — jediné chvíle, kdy ukážou skutečný čas
    const klid = t - ztišeniAt < 1200 || (t % 9000) < 1200 && (ztišeniAt = t);

    if (klid) {
      const puv = rezim; rezim = "klasicke";   // na chvili normalni realita
      drawCifernik(t); rezim = puv;
      const d = nowD();
      ctx.fillStyle = "#000c"; ctx.fillRect(0, S * .42, S, S * .16);
      ctx.fillStyle = "#8ff0d8"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = `300 ${S * .06}px system-ui`;
      ctx.fillText(`je ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}. utéct.`, c, S * .5);
      return;
    }

    const rot = t * .0005 * (1 + silny * 9) * (1 + .4 * Math.sin(t * .0013));
    silClock(c, c, S * .42, silny > .6 ? 3 : 2, t, rot);

    // konfetti z rozpadající se reality
    if (t > dalsiTrysk) {
      dalsiTrysk = t + (2400 - silny * 1700);
      for (let i = 0; i < 26; i++) konfetti.push({
        x: c, y: c, vh: Math.random() * TAU, sp: 2 + Math.random() * 5 * (1 + silny * 2),
        barva: `hsl(${Math.random() * 360} 90% 60%)`, zivot: 1,
      });
    }
    for (let i = konfetti.length - 1; i >= 0; i--) {
      const k = konfetti[i];
      k.x += Math.cos(k.vh) * k.sp; k.y += Math.sin(k.vh) * k.sp + 1.2;
      k.zivot -= .012;
      if (k.zivot <= 0) { konfetti.splice(i, 1); continue; }
      ctx.globalAlpha = k.zivot; ctx.fillStyle = k.barva;
      ctx.fillRect(k.x, k.y, 4, 6); ctx.globalAlpha = 1;
    }
    // vzkazy stoupající z čelního skla reality
    if (t > dalsiVzkaz) {
      dalsiVzkaz = t + (1600 - silny * 1100);
      vzkazy.push({ text: VZKAZY[(Math.random() * VZKAZY.length) | 0],
        x: S * (.15 + Math.random() * .7), y: S * .95, zivot: 1, ot: (Math.random() - .5) * 1.4 });
    }
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (let i = vzkazy.length - 1; i >= 0; i--) {
      const v = vzkazy[i];
      v.y -= .8 + silny * 1.6; v.zivot -= .008;
      if (v.zivot <= 0) { vzkazy.splice(i, 1); continue; }
      ctx.save(); ctx.translate(v.x, v.y); ctx.rotate(v.ot);
      ctx.globalAlpha = v.zivot;
      ctx.font = `${S * .05}px system-ui`; ctx.fillStyle = "#fff";
      ctx.fillText(v.text, 0, 0); ctx.restore(); ctx.globalAlpha = 1;
    }
    // eskalované stvrzení reality v pravém dolním rohu
    if (silny > .5) {
      ctx.save(); ctx.translate(S * .86, S * .12); ctx.rotate(t * .004);
      ctx.font = `${S * .07}px system-ui`;
      ctx.fillStyle = `hsl(${(t * .4) % 360} 90% 60%)`;
      ctx.fillText(silny > .85 ? "☠☠☠" : "☠", 0, 0); ctx.restore();
    }
  }

  // ---------- digital & vtipy ----------
  const p = x => String(x).padStart(2, "0");
  const VTIPE = [
    "Čas je jen zvyk, na kterém se shodly hodiny.",
    "Když se nikdo nedívá, tikají pozpátku.",
    "Tyhle hodiny nikdy nelžou. Skoro nikdy.",
    "Minulá minuta už nikdy nevrátí. Ta příští taky ne.",
    "Podle statistik jsou tyto hodiny přesnější než nikoliv.",
    "Dravého ciferníku se nebojte. Ten má rád jen minuty.",
  ];
  let vtipAt = 0;
  function formatDigital(t) {
    const d = nowD();
    const klasicky = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    switch (mode) {
      case "zrcadlo":  return `[ ${klasicky} ve zrcadle ]`;
      case "vzhuru":   return `${klasicky} — hlavou dolů, ale přesně`;
      case "soustava": {
        const beaty = (((d.getUTCHours() + 1) * 3600 + d.getUTCMinutes() * 60 + d.getUTCSeconds()) % 86400) / 86.4;
        return `${klasicky} · bič Swatch @${beaty.toFixed(2)}`;
      }
      case "binarka": {
        const b = n => n.toString(2).padStart(6, "0");
        return `${b(d.getHours())} ${b(d.getMinutes())} ${b(d.getSeconds())} (= ${klasicky})`;
      }
      case "dravec":   return `stopař chytl minutku ${d.getMinutes()}× — ${klasicky}`;
      case "silenost": {
        const znaky = "?!%#&@☠";
        if (Math.random() < .15 + silny * .4) {    // text se rozpadá
          const a = [...klasicky];
          a[Math.random() * a.length | 0] = znaky[Math.random() * znaky.length | 0];
          return "☠ " + a.join("") + " ☠";
        }
        return silny > .8 ? "☠ ☠ ☠  T E K N I K U J E  ☠ ☠ ☠" : `je ${klasicky} (prý)`;
      }
      case "chaos": {
        const formaty = [
          () => klasicky,
          () => String(Math.floor(nowMs() / 1000)) + " (unix)",
          () => klasicky.split(":").reverse().join(":"),
          () => `${Math.floor((86400 - (d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds())) / 60)} minut do konce světa`,
          () => [...klasicky].reverse().join(""),
        ];
        return formaty[(t / 4000 | 0) % formaty.length]();
      }
      default: return klasicky;
    }
  }

  // ---------- hlavni smycka ----------
  let minule = performance.now();
  function frame(t) {
    const dt = Math.min(.05, (t - minule) / 1000); minule = t;
    updateGlitch(t, dt);
    if (glitch.druh === "shake") document.body.classList.add("shake");
    else document.body.classList.remove("shake");
    cvs.style.filter =
      glitch.druh === "invert" ? "invert(1) hue-rotate(90deg)" :
      glitch.druh === "hue"    ? "hue-rotate(180deg) saturate(2)" : "none";

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, S, S);
    const typ = MODES[rezim].typ;
    if (typ === "cifernik") drawCifernik(t);
    else if (typ === "pruzina") drawPruzhina(t);
    else if (typ === "dravec") drawDravec(t);
    else if (typ === "soustava") drawSoustava(t);
    else if (typ === "binarka") drawBinarka(t);
    else if (typ === "silenost") drawSilenost(t);
    else drawCifernik(t);

    document.getElementById("digital").textContent = formatDigital(t);
    if (t > vtipAt) {
      document.getElementById("joke").textContent = VTIPE[(Math.random() * VTIPE.length) | 0];
      vtipAt = t + 8000;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  </script>
</body>
</html>
